name: saf

services:
  db:
    image: kruacent/saf-db:${SAF_TAG:-latest}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:-SAFSql}
      MYSQL_USER: ${DB_USER:-SAFUser}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: kruacent/saf-api:${SAF_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-SAFSql}
      DB_USER: ${DB_USER:-SAFUser}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SERVER_PORT: 5000
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5000}:5000"

  web:
    image: kruacent/saf-web:${SAF_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:5000
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
